<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Masuk | SESIQ</title>
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="logo.jpeg" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card reveal" id="authCard">
      <div class="auth-head">
        <img src="logo.jpeg" alt="Logo" class="logo-img" />
        <span class="wordmark">SESIQ</span>
        <h1>Log masuk</h1>
        <p class="lede">Sistem Rekod Sesi Klien</p>
      </div>
      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="loginEmail">Emel</label>
          <input id="loginEmail" name="loginEmail" type="email" placeholder="nama@upk.edu" autocomplete="username" required />
        </div>
        <div class="field">
          <div class="label-row">
            <label for="loginPassword">Kata laluan</label>
            <button type="button" class="link-btn" id="resetPassword">Lupa?</button>
          </div>
          <input id="loginPassword" name="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="primary" id="loginButton">Log masuk</button>
        <div id="loginError" class="error hidden">Emel atau kata laluan tidak tepat.</div>
        <div id="loginInfo" class="hint hidden"></div>
      </form>
      <p class="auth-foot">made by Dynozz.</p>
    </div>
  </main>

  <script src="ui.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDURmoIpmfcrxG8I6Uf7aBCBsiS-T0Hv8k",
      authDomain: "upk-log.firebaseapp.com",
      databaseURL: "https://upk-log-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "upk-log",
      storageBucket: "upk-log.appspot.com",
      messagingSenderId: "394230039028",
      appId: "1:394230039028:web:d7d69ba62d28075684b9a1",
      measurementId: "G-NV4HLR1NMB"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const loginInfo = document.getElementById('loginInfo');
    const resetPasswordButton = document.getElementById('resetPassword');

    const loginButton = document.getElementById('loginButton');
    const authCard = document.getElementById('authCard');

    const goToDashboard = () => {
      SesiqUI.leaveTo('dashboard.html');
    };

    window.addEventListener('DOMContentLoaded', () => {
      auth.onAuthStateChanged((user) => {
        if (user) {
          goToDashboard();
        }
      });

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = loginForm.loginEmail.value.trim();
        const password = loginForm.loginPassword.value;
        loginButton.disabled = true;
        loginButton.classList.add('loading');
        loginError.classList.add('hidden');
        try {
          await auth.signInWithEmailAndPassword(email, password);
          goToDashboard();
        } catch (error) {
          loginError.textContent = 'Emel atau kata laluan tidak tepat.';
          loginError.classList.remove('hidden');
          authCard.classList.remove('reveal', 'shake');
          void authCard.offsetWidth;
          authCard.classList.add('shake');
          loginButton.disabled = false;
          loginButton.classList.remove('loading');
        }
      });

      resetPasswordButton.addEventListener('click', async () => {
        const email = loginForm.loginEmail.value.trim();
        loginError.classList.add('hidden');
        if (!email) {
          loginError.textContent = 'Masukkan emel dahulu untuk reset kata laluan.';
          loginError.classList.remove('hidden');
          return;
        }
        try {
          await auth.sendPasswordResetEmail(email);
        } catch (error) {
          console.error('Ralat reset kata laluan:', error);
        }
        // Mesej sama walaupun gagal supaya tidak dedahkan sama ada emel wujud
        loginInfo.textContent = 'Jika emel ini berdaftar, pautan reset kata laluan telah dihantar.';
        loginInfo.classList.remove('hidden');
      });
    });
  </script>
</body>
</html>
